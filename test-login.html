<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ログイン確認（一時）</title>
<style>
  :root { --bg:#F4F7FA; --card:#fff; --ink:#14263A; --muted:#5B6B7C; --ok:#1E7D45; --ng:#B3261E; --line:#DCE3EA; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .mark { width: 28px; flex: none; font-size: 20px; text-align: center; }
  .ok { color: var(--ok); } .ng { color: var(--ng); } .wait { color: var(--muted); }
  .label { font-weight: 600; }
  .detail { color: var(--muted); font-size: 13px; }
  #summary { margin: 16px 0 0; padding: 14px; border-radius: 12px; font-weight: 700; text-align: center; }
  #summary.ok { background: #E3F4EA; } #summary.ng { background: #FBE6E4; } #summary.wait { background: #E8EDF2; }
</style>
</head>
<body>
<main>
  <h1>ログイン処理の確認（一時的なページ）</h1>
  <p class="note">新しいログイン処理（テスト配置）を確認するためのページです。管理者アカウントだけが成功し、ログイン状態はその場で失効します。確認後に削除します。</p>
  <div class="card" id="list"></div>
  <div id="summary" class="wait">確認中…</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(async () => {
  const LIFF_ID = "2011936101-ginMHUJW"; // 開発用
  const URL_V2 = "https://tuaexfmrloajgwvbrqrw.supabase.co/functions/v1/line-login-v2";
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");
  const results = [];

  function addRow(label, expected) {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<div class="mark wait">…</div><div><div class="label"></div><div class="detail"></div></div>`;
    el.querySelector(".label").textContent = label;
    el.querySelector(".detail").textContent = `期待：${expected}`;
    list.appendChild(el);
    return (ok, actual) => {
      results.push(ok);
      const m = el.querySelector(".mark");
      m.textContent = ok ? "✓" : "✗";
      m.className = "mark " + (ok ? "ok" : "ng");
      el.querySelector(".detail").textContent = `期待：${expected} ／ 結果：${actual}`;
    };
  }

  async function call(body, method = "POST") {
    const init = { method };
    if (method === "POST") { init.headers = { "Content-Type": "application/json" }; init.body = body; }
    const r = await fetch(URL_V2, init);
    let j = {};
    try { j = await r.json(); } catch { /* 本文なし */ }
    return { status: r.status, body: j };
  }

  const b64 = (o) => btoa(JSON.stringify(o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error("LINEの情報を取得できませんでした");

    // T1 実際の管理者アカウント
    let done = addRow("T1 管理者アカウントでの判定", "成功・ログイン状態は即失効");
    let r = await call(JSON.stringify({ idToken, accessToken: liff.getAccessToken() }));
    done(r.status === 200 && r.body.test === true && r.body.session_revoked === true && r.body.account_check === "passed" && !("access_token" in r.body),
      r.status === 200 ? `成功（会員情報あり：${r.body.member_found ? "はい" : "いいえ"}、トークンの返却なし）` : `${r.status} ${r.body.error || ""}`);

    // T2〜T6 不正な呼び出し
    const fakeProd = `${b64({ alg: "ES256" })}.${b64({ aud: "2011936103", sub: "Ufake" })}.invalidsignature`;
    const fakeOther = `${b64({ alg: "ES256" })}.${b64({ aud: "1234567890", sub: "Ufake" })}.sig`;
    const cases = [
      ["T2 トークンなし", "{}", "POST", 401],
      ["T3 形式が壊れたトークン", JSON.stringify({ idToken: "abc" }), "POST", 401],
      ["T4 偽造トークン（本番チャネル・正しい署名なし）", JSON.stringify({ idToken: fakeProd }), "POST", 401],
      ["T5 許可していないチャネルのトークン", JSON.stringify({ idToken: fakeOther }), "POST", 401],
      ["T6 GETでの呼び出し", null, "GET", 405],
    ];
    for (const [label, body, method, want] of cases) {
      done = addRow(label, `拒否（${want}）`);
      r = await call(body, method);
      done(r.status === want && !("access_token" in r.body), `${r.status} ${r.body.error || ""}`);
    }

    const allOk = results.every(Boolean);
    summary.textContent = allOk ? `すべて期待どおり（${results.length}項目）` : "期待と違う結果があります。この画面のスクリーンショットを送ってください";
    summary.className = allOk ? "ok" : "ng";
  } catch (e) {
    summary.textContent = "確認を実行できませんでした：" + (e && e.message ? e.message : e);
    summary.className = "ng";
  }
})();
</script>
</body>
</html>
